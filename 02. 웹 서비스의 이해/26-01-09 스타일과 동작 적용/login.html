<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="login.css">
    <script type="text/javascript" src="login.js"></script>
</head>
<body>
    <div class="container">
        <h1>로그인</h1>
        <form>
            <div class="login_field">
                <p>아이디</p>
                <input type="text" placeholder="아이디를 입력해 주세요." class="login_input">
            </div>
            <div class="login_field">
                <p>비밀번호</p>
                <input type="password" placeholder="비밀번호를 입력해 주세요." class="login_input">
            </div>
            <input type="button" value="로그인" id="login_button" class="login_button" onclick="popId()">
        </form>
    </div>
</body>
</html>
